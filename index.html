<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFRT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f5f5, #ffffff);
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 80px 20px;
    }

    .logo {
      width: 90px;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    h1 {
      font-size: 34px;
      letter-spacing: 8px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      font-size: 13px;
      margin-bottom: 40px;
    }

    .concept {
      font-size: 16px;
      margin-bottom: 60px;
      line-height: 1.8;
    }

    /* 概要 */
    .about {
      text-align: left;
      margin-bottom: 60px;
      padding: 25px;
      border-radius: 16px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(10px);
      border: 1px solid #eee;
    }

    .about h2 {
      font-size: 16px;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .about p {
      font-size: 14px;
      color: #444;
      line-height: 1.8;
    }

    /* NEWS */
    .news {
      text-align: left;
      padding-top: 20px;
    }

    .news h2 {
      font-size: 16px;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .news-item {
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
      background: #fff;
      border: 1px solid #eee;
      cursor: pointer;
      transition: 0.3s;
    }

    .news-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }

    .news-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .date {
      color: #888;
    }

    .title {
      font-weight: 500;
    }

    .news-content {
      font-size: 13px;
      color: #555;
      margin-top: 10px;
      display: none;
      line-height: 1.6;
    }

    footer {
      margin-top: 80px;
      font-size: 12px;
      color: #aaa;
    }

  </style>
</head>

<body>

<div class="container">

  <img src="logo.png" class="logo">

  <h1>MFRT</h1>
  <p class="subtitle">Multi Field Art Team</p>

  <p class="concept">
    ジャンルに縛られない表現集団
  </p>

  <!-- 概要 -->
  <div class="about">
    <h2>ABOUT</h2>
    <p>
      MFRTは、音楽・映像・デザインなど<br>
      複数の分野を横断するクリエイティブチームです。<br><br>
      固定されたジャンルに依存せず、<br>
      それぞれの感性と領域を混ぜ合わせることで、<br>
      新しい表現の形を模索しています。
    </p>
  </div>

  <!-- NEWS -->
  <div class="news">
    <h2>NEWS</h2>

    <div class="news-item" onclick="toggle(this)">
      <div class="news-header">
        <span class="date">2026.04.06</span>
        <span class="title">無事設立</span>
      </div>
      <div class="news-content">
        本日ノリと勢いでこの集団が完成しました。
      </div>
    </div>
<div class="news-item" onclick="toggle(this)">
  <div class="news-header">
    <span class="date">2026.06.18</span>
    <span class="title">coming soon...</span>
  </div>
  <div class="news-content">
    お待ちを...
  </div>
</div>
  </div>

  <footer>
    © MFRT
  </footer>

</div>

<script>
function toggle(element) {
  const content = element.querySelector(".news-content");
  content.style.display =
    content.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
